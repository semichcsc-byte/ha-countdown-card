name: Validate

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # HACS validates against its current rules, so this catches breakage
    # introduced by HACS itself, not just by our commits.
    - cron: "0 4 * * 1"

jobs:
  hacs:
    name: Marketplace / HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          comment: false
